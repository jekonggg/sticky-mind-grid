name: Automated Testing Suite

on:
  push:
    branches: [ main, MultiUserCollab ]
  pull_request:
    branches: [ main, MultiUserCollab ]

jobs:
  backend-tests:
    name: Backend API, RBAC & Coverage Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite with Coverage
        run: pytest --cov=app tests -v

  frontend-tests:
    name: Frontend Typecheck & Vitest Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Suite with Coverage
        run: npm run test:coverage

  e2e-tests:
    name: Playwright Full-Stack E2E Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sticky_mind_grid_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/sticky_mind_grid_test?charset=utf8mb4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Seed Test Database
        working-directory: backend
        run: |
          for i in {1..10}; do
            python seed.py && break
            echo "Seed attempt $i failed, retrying..."
            sleep 2
          done

      - name: Start Flask Backend Daemon
        working-directory: backend
        run: |
          python run.py &
          sleep 3
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/api/health | grep -q "healthy"; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
