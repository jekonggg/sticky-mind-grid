name: Automated Testing Suite

on:
  push:
    branches: [ main, MultiUserCollab ]
  pull_request:
    branches: [ main, MultiUserCollab ]

jobs:
  backend-tests:
    name: Backend API, RBAC & Coverage Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite with Coverage
        run: pytest --cov=app tests -v

  frontend-tests:
    name: Frontend Typecheck & Vitest Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Suite with Coverage
        run: npm run test:coverage

  e2e-tests:
    name: Playwright Full-Stack E2E Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sticky_mind_grid_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/sticky_mind_grid_test?charset=utf8mb4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Seed Test Database
        working-directory: backend
        run: |
          SEED_OK=false
          for i in {1..10}; do
            if python seed.py; then
              echo "Seed succeeded on attempt $i"
              SEED_OK=true
              break
            fi
            echo "Seed attempt $i failed, retrying..."
            sleep 2
          done
          if [ "$SEED_OK" != "true" ]; then
            echo "ERROR: Seed failed after 10 attempts"
            exit 1
          fi
          python -c "
          from app import create_app, db
          app = create_app()
          with app.app_context():
              result = db.session.execute(db.text('SHOW TABLES'))
              tables = [row[0] for row in result]
              print(f'DB OK - {len(tables)} tables: {tables}')
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          FLASK_DEBUG: "false"
        run: |
          cd backend && python run.py &
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 &
          sleep 5
          BACKEND_READY=false
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/api/health | grep -q "healthy"; then
              echo "Backend is ready!"
              BACKEND_READY=true
              break
            fi
            echo "Waiting for backend... (attempt $i/30)"
            sleep 1
          done
          if [ "$BACKEND_READY" != "true" ]; then
            echo "ERROR: Backend failed to become healthy after 30 attempts"
            curl -s http://127.0.0.1:5000/api/health || true
            kill %1 2>/dev/null || true
            kill %2 2>/dev/null || true
            exit 1
          fi
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              break
            fi
            echo "Waiting for frontend... (attempt $i/30)"
            sleep 1
          done
          ./node_modules/.bin/playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
